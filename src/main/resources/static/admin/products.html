<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Admin - SmartMart</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
            <h2>Admin Panel</h2>
        </div>
        <nav class="admin-sidebar-nav">
            <a href="dashboard.html" class="admin-nav-link">📊 Dashboard</a>
            <a href="products.html" class="admin-nav-link active">📦 Products</a>
            <a href="categories.html" class="admin-nav-link">📁 Categories</a>
            <a href="suppliers.html" class="admin-nav-link">🏪 Suppliers</a>
            <a href="customers.html" class="admin-nav-link">👥 Customers</a>
            <a href="orders.html" class="admin-nav-link">📦 Orders</a>
            <a href="inventory.html" class="admin-nav-link">📊 Inventory</a>
        </nav>
    </aside>
    
    <!-- Main Content -->
    <main class="admin-content">
        <div class="admin-header">
            <h1 style="margin: 0;">Product Management</h1>
            <button class="admin-toggle" onclick="AdminUI.toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        
        <!-- Error/Success Messages -->
        <div id="error-message" class="alert alert-error" style="display: none;"></div>
        <div id="success-message" class="alert alert-success" style="display: none;"></div>
        
        <div style="margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center;">
            <button class="btn btn-primary" onclick="AdminUI.showAddProductForm()">
                <i class="fas fa-plus"></i> Add Product
            </button>
            <input type="text" id="search-product" placeholder="Search products..." class="form-control" style="max-width: 300px;">
            <select id="category-filter" class="form-control" style="max-width: 200px;">
                <option value="">All Categories</option>
            </select>
        </div>
        
        <div id="product-list">
            <div class="spinner"></div>
        </div>
    </main>
    
    <!-- Add/Edit Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="product-modal-title">Add Product</h2>
                <button class="modal-close" onclick="AdminUI.closeProductModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="product-form">
                    <input type="hidden" id="product-id">
                    
                    <div class="form-group">
                        <label class="form-label">Product Name</label>
                        <input type="text" id="product-name" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">SKU</label>
                        <input type="text" id="product-sku" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="product-description" class="form-control" rows="3"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Price</label>
                        <input type="number" id="product-price" class="form-control" step="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="product-category" class="form-control">
                            <option value="">Select Category</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Supplier</label>
                        <select id="product-supplier" class="form-control">
                            <option value="">Select Supplier</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Initial Stock</label>
                        <input type="number" id="product-stock" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Active</label>
                        <select id="product-active" class="form-control">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="AdminUI.closeProductModal()">Cancel</button>
                <button class="btn btn-primary" onclick="AdminUI.saveProduct()">Save Product</button>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!SmartMartAPI.Auth.isAdmin()) {
                window.location.href = '../index.html';
                return;
            }
            
            AdminUI.renderSidebar();
            AdminUI.renderProductList();
            AdminUI.loadCategories();
            AdminUI.loadSuppliers();
        });
    </script>
</body>
</html>
