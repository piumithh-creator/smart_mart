# =============================================
# SmartMart – Application Configuration
# =============================================

spring.application.name=smartmart

# ---- DataSource ----
spring.datasource.url=jdbc:mysql://localhost:3306/smartmart1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Seed data ----
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ---- Server ----
server.port=8080
server.servlet.context-path=/

# ---- JWT ----
jwt.secret=${JWT_SECRET:SmartMartSuperSecretKeyForJWTTokenGenerationMustBe256BitsLong!}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ---- Logging ----
logging.level.com.example.smartmart=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---- SpringDoc / Swagger ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
